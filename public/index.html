<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>AI Farm Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    /* Fill full screen on mobile, handle safe areas */
    html, body { height: 100%; height: 100dvh; overflow: hidden; }

    /* Bubble markdown content */
    .bubble-content p { margin-bottom: 0.45rem; line-height: 1.6; }
    .bubble-content p:last-child { margin-bottom: 0; }
    .bubble-content ul, .bubble-content ol { padding-left: 1.1rem; margin-bottom: 0.4rem; }
    .bubble-content li { margin-bottom: 0.2rem; }
    .bubble-content strong { font-weight: 700; }
    .bubble-content h1, .bubble-content h2, .bubble-content h3 { font-weight: 700; margin-bottom: 0.3rem; font-size: 0.95rem; }

    /* Bottom safe area for phones with home indicator */
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }

    /* Smooth scroll in chat */
    #chat-window { scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }

    /* Prevent iOS zoom on input focus */
    textarea, select { font-size: 16px !important; }

    /* Tap highlight off */
    button { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="flex flex-col bg-gray-100" style="font-family:system-ui,-apple-system,'Segoe UI',sans-serif; height:100dvh;">

<!-- ── Top bar ─────────────────────────────────────────────────────────────── -->
<div class="bg-green-700 text-white shrink-0 shadow-md" style="padding-top: env(safe-area-inset-top, 0px)">
  <!-- Row 1: avatar + name + lang toggle -->
  <div class="flex items-center gap-3 px-4 pt-3 pb-1">
    <div class="w-9 h-9 rounded-full bg-green-500 flex items-center justify-center font-bold text-base shrink-0">A</div>
    <div class="flex-1 min-w-0">
      <p class="font-semibold text-sm leading-tight">AI Farm Assistant</p>
      <p id="header-sub" class="text-xs text-green-200 truncate">AI-powered advice for Rwandan farmers</p>
    </div>
    <!-- Language pills -->
    <div class="flex rounded-full border border-green-500 overflow-hidden shrink-0">
      <button id="btn-en" onclick="setLang('english')"
        class="px-3 py-1.5 text-xs font-bold bg-white text-green-700 leading-none">EN</button>
      <button id="btn-rw" onclick="setLang('kinyarwanda')"
        class="px-3 py-1.5 text-xs font-bold text-green-200 leading-none">RW</button>
    </div>
  </div>
  <!-- Row 2: crop selector full width -->
  <div class="px-4 pb-3">
    <select id="crop-select"
      class="w-full bg-green-600 text-white border border-green-500 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-white/30 appearance-none cursor-pointer">
      <option value="maize">Maize</option>
      <option value="beans">Beans</option>
      <option value="coffee">Coffee</option>
      <option value="potatoes">Potatoes</option>
    </select>
  </div>
</div>

<!-- ── Chat window ─────────────────────────────────────────────────────────── -->
<div id="chat-window"
  class="flex-1 overflow-y-auto px-3 py-4 space-y-3"
  style="background-color:#e5ded8;">
</div>

<!-- ── Input bar ──────────────────────────────────────────────────────────── -->
<div class="shrink-0 bg-gray-100 border-t border-gray-200 safe-bottom">
  <div class="flex items-end gap-2 px-3 py-2">
    <textarea id="question-input" rows="1"
      placeholder="Ask a farming question…"
      class="flex-1 rounded-2xl border border-gray-300 bg-white px-4 py-3 text-sm resize-none focus:outline-none focus:border-green-500 focus:ring-2 focus:ring-green-100 leading-snug"
      style="max-height:120px; min-height:44px;"
      oninput="autoResize(this)"></textarea>
    <button id="submit-btn" onclick="submitQuestion()"
      class="w-11 h-11 rounded-full bg-green-600 active:bg-green-800 disabled:opacity-40 flex items-center justify-center shrink-0 transition-colors">
      <svg id="send-icon" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="currentColor">
        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
      </svg>
      <svg id="btn-spinner" class="hidden animate-spin w-5 h-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
      </svg>
    </button>
  </div>

  <!-- Stats toggle -->
  <button onclick="toggleStats()"
    class="w-full flex items-center justify-between px-4 py-2 text-xs font-semibold text-gray-400 uppercase tracking-wide border-t border-gray-200 active:bg-gray-200">
    <span id="stats-label">Usage Stats</span>
    <svg id="stats-chevron" class="w-4 h-4 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
    </svg>
  </button>
  <div id="stats-panel" class="hidden px-3 pb-3">
    <div class="grid grid-cols-2 gap-2">
      <div class="bg-white rounded-xl p-3 shadow-sm">
        <p id="lbl-chart-crop" class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2">By Crop</p>
        <canvas id="cropChart"></canvas>
      </div>
      <div class="bg-white rounded-xl p-3 shadow-sm">
        <p id="lbl-chart-lang" class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2">By Language</p>
        <canvas id="langChart"></canvas>
      </div>
    </div>
  </div>
</div>

<script>
marked.setOptions({ breaks: true });

let currentLang = 'english';
let cropChart, langChart;
let statsOpen = false;

const i18n = {
  english: {
    headerSub:   'AI-powered advice for Rwandan farmers',
    placeholder: 'Ask a farming question…',
    chartCrop:   'By Crop',
    chartLang:   'By Language',
    statsLabel:  'Usage Stats',
    errorApi:    'Something went wrong. Please try again.',
    crops: { maize:'Maize', beans:'Beans', coffee:'Coffee', potatoes:'Potatoes' },
  },
  kinyarwanda: {
    headerSub:   'Inama z\'ubuhinzi zikoresheje AI ku bahinzi b\'u Rwanda',
    placeholder: 'Baza ikibazo cy\'ubuhinzi…',
    chartCrop:   'Ukurikije Igihingwa',
    chartLang:   'Ukurikije Ururimi',
    statsLabel:  'Imibare',
    errorApi:    'Hari ikibazo cyabaye. Gerageza nanone.',
    crops: { maize:'Ibigori', beans:'Ibishyimbo', coffee:'Ikawa', potatoes:'Ibirayi' },
  },
};

// ── Language ──────────────────────────────────────────────────────────────────
function setLang(lang) {
  currentLang = lang;
  const t = i18n[lang];
  document.getElementById('header-sub').textContent     = t.headerSub;
  document.getElementById('question-input').placeholder = t.placeholder;
  document.getElementById('lbl-chart-crop').textContent = t.chartCrop;
  document.getElementById('lbl-chart-lang').textContent = t.chartLang;
  document.getElementById('stats-label').textContent    = t.statsLabel;

  const sel = document.getElementById('crop-select');
  ['maize','beans','coffee','potatoes'].forEach(c => {
    const o = sel.querySelector(`option[value="${c}"]`);
    if (o) o.textContent = t.crops[c];
  });

  const btnEn = document.getElementById('btn-en');
  const btnRw = document.getElementById('btn-rw');
  if (lang === 'english') {
    btnEn.className = 'px-3 py-1.5 text-xs font-bold bg-white text-green-700 leading-none';
    btnRw.className = 'px-3 py-1.5 text-xs font-bold text-green-200 leading-none';
  } else {
    btnRw.className = 'px-3 py-1.5 text-xs font-bold bg-white text-green-700 leading-none';
    btnEn.className = 'px-3 py-1.5 text-xs font-bold text-green-200 leading-none';
  }
}

// ── Textarea resize ───────────────────────────────────────────────────────────
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

// ── Time helper ───────────────────────────────────────────────────────────────
function timeStr() {
  return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

// ── Add bubble ────────────────────────────────────────────────────────────────
function addBubble(text, side, crop, lang) {
  const win = document.getElementById('chat-window');
  const wrapper = document.createElement('div');
  wrapper.className = side === 'user' ? 'flex justify-end' : 'flex justify-start';

  const bubble = document.createElement('div');

  if (side === 'user') {
    // Max 80% width so it never stretches edge to edge
    bubble.className = 'bg-green-600 text-white rounded-2xl rounded-tr-sm px-4 py-2.5 shadow-sm';
    bubble.style.maxWidth = '80%';
    bubble.innerHTML = `
      <p class="text-sm leading-snug break-words">${escHtml(text)}</p>
      <p class="text-xs text-green-200 text-right mt-1 opacity-80">${timeStr()}</p>`;
  } else {
    const cropLabel = i18n[currentLang].crops[crop] || crop;
    const langLabel = lang === 'english' ? 'EN' : 'RW';
    bubble.className = 'bg-white text-gray-800 rounded-2xl rounded-tl-sm px-4 py-3 shadow-sm';
    bubble.style.maxWidth = '88%';
    bubble.innerHTML = `
      <div class="flex gap-1.5 mb-2 flex-wrap">
        <span class="bg-green-100 text-green-800 text-xs font-semibold px-2 py-0.5 rounded-full">${escHtml(cropLabel)}</span>
        <span class="bg-green-100 text-green-800 text-xs font-semibold px-2 py-0.5 rounded-full">${escHtml(langLabel)}</span>
      </div>
      <div class="bubble-content text-sm leading-relaxed break-words">${marked.parse(text)}</div>
      <p class="text-xs text-gray-400 text-right mt-2 opacity-70">${timeStr()}</p>`;
  }

  wrapper.appendChild(bubble);
  win.appendChild(wrapper);
  // Scroll to bottom
  setTimeout(() => { win.scrollTop = win.scrollHeight; }, 50);
}

// ── Typing indicator ──────────────────────────────────────────────────────────
function addTypingIndicator() {
  const win = document.getElementById('chat-window');
  const w = document.createElement('div');
  w.id = 'typing-indicator';
  w.className = 'flex justify-start';
  w.innerHTML = `
    <div class="bg-white rounded-2xl rounded-tl-sm px-4 py-3 shadow-sm flex gap-1.5 items-center">
      <span class="w-2.5 h-2.5 bg-gray-300 rounded-full animate-bounce" style="animation-delay:0ms"></span>
      <span class="w-2.5 h-2.5 bg-gray-300 rounded-full animate-bounce" style="animation-delay:160ms"></span>
      <span class="w-2.5 h-2.5 bg-gray-300 rounded-full animate-bounce" style="animation-delay:320ms"></span>
    </div>`;
  win.appendChild(w);
  setTimeout(() => { win.scrollTop = win.scrollHeight; }, 50);
}

function removeTypingIndicator() {
  document.getElementById('typing-indicator')?.remove();
}

// ── Submit ────────────────────────────────────────────────────────────────────
async function submitQuestion() {
  const input    = document.getElementById('question-input');
  const question = input.value.trim();
  const crop     = document.getElementById('crop-select').value;

  if (!question) return;

  addBubble(question, 'user', crop, currentLang);
  input.value = '';
  input.style.height = 'auto';

  // Dismiss keyboard on mobile
  input.blur();

  const btn      = document.getElementById('submit-btn');
  const sendIcon = document.getElementById('send-icon');
  const spinner  = document.getElementById('btn-spinner');
  btn.disabled = true;
  sendIcon.classList.add('hidden');
  spinner.classList.remove('hidden');
  addTypingIndicator();

  try {
    const res = await fetch('/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question, language: currentLang, crop }),
      signal: AbortSignal.timeout(30000),
    });
    const data = await res.json();
    removeTypingIndicator();
    addBubble(res.ok ? data.answer : (data.error || i18n[currentLang].errorApi), 'ai', crop, currentLang);
    if (res.ok) loadStats();
  } catch (err) {
    removeTypingIndicator();
    addBubble(i18n[currentLang].errorApi, 'ai', crop, currentLang);
  } finally {
    btn.disabled = false;
    sendIcon.classList.remove('hidden');
    spinner.classList.add('hidden');
  }
}

// Enter = send, Shift+Enter = newline
document.getElementById('question-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitQuestion(); }
});

// ── Stats ─────────────────────────────────────────────────────────────────────
function toggleStats() {
  statsOpen = !statsOpen;
  document.getElementById('stats-panel').classList.toggle('hidden', !statsOpen);
  document.getElementById('stats-chevron').style.transform = statsOpen ? 'rotate(180deg)' : '';
  if (statsOpen) loadStats();
}

async function loadStats() {
  try {
    const res = await fetch('/stats');
    if (!res.ok) return;
    const { byCrop, byLanguage } = await res.json();

    const cropMap = { maize:'Maize', beans:'Beans', coffee:'Coffee', potatoes:'Potatoes' };
    if (cropChart) cropChart.destroy();
    cropChart = new Chart(document.getElementById('cropChart'), {
      type: 'bar',
      data: {
        labels: byCrop.map(d => cropMap[d.crop] || d.crop),
        datasets: [{ data: byCrop.map(d => d.count),
          backgroundColor: ['#16a34a','#4ade80','#166534','#86efac'],
          borderRadius: 4, borderSkipped: false }],
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: {
          y: { beginAtZero: true, ticks: { precision: 0, font: { size: 9 } }, grid: { color: '#f0fdf4' } },
          x: { ticks: { font: { size: 9 } }, grid: { display: false } },
        },
      },
    });

    if (langChart) langChart.destroy();
    langChart = new Chart(document.getElementById('langChart'), {
      type: 'bar',
      data: {
        labels: byLanguage.map(d => d.language === 'english' ? 'EN' : 'RW'),
        datasets: [{ data: byLanguage.map(d => d.count),
          backgroundColor: ['#16a34a','#4ade80'],
          borderRadius: 4, borderSkipped: false }],
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: {
          y: { beginAtZero: true, ticks: { precision: 0, font: { size: 9 } }, grid: { color: '#f0fdf4' } },
          x: { ticks: { font: { size: 9 } }, grid: { display: false } },
        },
      },
    });
  } catch (e) { console.warn('Stats failed', e); }
}

// ── History ───────────────────────────────────────────────────────────────────
async function loadHistory() {
  try {
    const res = await fetch('/history');
    if (!res.ok) return;
    const items = await res.json();
    if (!items.length) return;
    [...items].reverse().forEach(item => {
      addBubble(item.question, 'user', item.crop, item.language);
      addBubble(item.answer,   'ai',   item.crop, item.language);
    });
  } catch (e) { console.warn('History failed', e); }
}

function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

loadHistory();
</script>
</body>
</html>
